# Central config — override via CLI flags in each script.
data:
  url: "http://vision.princeton.edu/projects/2014/3DShapeNets/ModelNet10.zip"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  num_points: 1024
  max_samples_per_class: 200   # laptop-friendly subset; null = full
  test_split: "test"
  seed: 42

train:
  embedding_dim: 64
  epochs: 10
  batch_size: 32
  lr: 0.001
  num_points: 1024
  baseline_dim: 32

eval:
  k: [1, 5, 10]

index:
  model: "pointnet"
  index_path: "artifacts/index.faiss"
  metadata_path: "artifacts/metadata.json"

mlflow:
  tracking_uri: "./mlruns"
  experiment: "shape-retrieval"

serve:
  model: "pointnet"
  encoder_path: "artifacts/pointnet.pt"
  baseline_path: "artifacts/baseline.pkl"
  index_path: "artifacts/index.faiss"
  metadata_path: "artifacts/metadata.json"
  num_points: 1024
